<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Hexagonal background -->
  <path d="M256 32 L422 128 L422 384 L256 480 L90 384 L90 128 Z"
        fill="url(#hexGradient)"
        filter="url(#shadow)"
        stroke="none"/>

  <!-- Printed sheet, emerging from the printer's feed slot -->
  <rect x="176" y="66" width="160" height="150"
        rx="6" ry="6"
        fill="white"
        stroke="none"/>

  <!-- Folded corner, to read clearly as a sheet of paper -->
  <path d="M300 66 L336 66 L336 102 Z" fill="#eaf6fb"/>
  <path d="M300 66 L336 102 L300 102 Z" fill="white" stroke="#bfe4f0" stroke-width="2" stroke-linejoin="round"/>

  <!-- Printed field lines on the sheet -->
  <rect x="200" y="96" width="80" height="10" rx="2" ry="2" fill="#0077B6" opacity="0.7"/>
  <rect x="200" y="122" width="112" height="10" rx="2" ry="2" fill="#0077B6" opacity="0.7"/>
  <rect x="200" y="148" width="64" height="10" rx="2" ry="2" fill="#0077B6" opacity="0.7"/>
  <rect x="276" y="148" width="36" height="10" rx="2" ry="2" fill="#0077B6" opacity="0.7"/>
  <rect x="200" y="174" width="96" height="10" rx="2" ry="2" fill="#0077B6" opacity="0.7"/>

  <!-- Printer body -->
  <rect x="118" y="216" width="276" height="132"
        rx="22" ry="22"
        fill="white"
        stroke="none"/>

  <!-- Feed slot: where the sheet meets the printer housing -->
  <rect x="150" y="208" width="212" height="16"
        rx="6" ry="6"
        fill="url(#hexGradient)"/>

  <!-- Status lights -->
  <circle cx="342" cy="250" r="9" fill="url(#hexGradient)" opacity="0.85"/>
  <circle cx="342" cy="278" r="9" fill="url(#hexGradient)" opacity="0.5"/>

  <!-- Control panel bar -->
  <rect x="142" y="242" width="120" height="14" rx="7" ry="7" fill="url(#hexGradient)" opacity="0.35"/>
  <rect x="142" y="266" width="90" height="14" rx="7" ry="7" fill="url(#hexGradient)" opacity="0.35"/>

  <!-- Output tray -->
  <rect x="146" y="356" width="220" height="20"
        rx="6" ry="6"
        fill="white"
        opacity="0.95"/>
  <rect x="160" y="352" width="192" height="8"
        rx="4" ry="4"
        fill="#eaf6fb"/>

  <!-- PRTF text indicator -->
  <text x="256" y="440"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        text-anchor="middle"
        fill="white"
        opacity="0.9">PRTF</text>
</svg>
